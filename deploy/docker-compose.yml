services:
  postgres:
    image: postgres:16-alpine
    container_name: wealthstack-postgres
    environment:
      POSTGRES_USER: wealthstack
      POSTGRES_PASSWORD: wealthstack
      POSTGRES_DB: wealthstack
    ports:
      - "5432:5432"
    volumes:
      - wealthstack_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wealthstack -d wealthstack"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  migrate:
    image: migrate/migrate:v4.18.2
    volumes:
      - ../backend/migrations:/migrations
    command:
      [
        "-path",
        "/migrations",
        "-database",
        "postgres://wealthstack:wealthstack@postgres:5432/wealthstack?sslmode=disable",
        "up",
      ]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  migrate-local:
    image: migrate/migrate:v4.18.2
    volumes:
      - ../backend/migrations-local:/migrations
    command:
      [
        "-path",
        "/migrations",
        "-database",
        "postgres://wealthstack:wealthstack@postgres:5432/wealthstack?sslmode=disable&x-migrations-table=local_schema_migrations",
        "up",
      ]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: wealthstack-api
    environment:
      DATABASE_URL: postgres://wealthstack:wealthstack@postgres:5432/wealthstack?sslmode=disable
      JWT_SECRET: dev-secret-change-in-production
      HTTP_PORT: "8080"
      CORS_ORIGINS: "*"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      migrate-local:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    container_name: wealthstack-web
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  wealthstack_pgdata:
