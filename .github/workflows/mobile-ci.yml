name: Mobile CI

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: mobile-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mobile:
    name: Mobile validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w @wealth-stack/shared

      - name: Lint
        working-directory: mobile
        run: npm run lint

      - name: TypeScript validation
        working-directory: mobile
        run: npm run typecheck

      - name: Tests and coverage
        working-directory: mobile
        run: npm run coverage:sonar

      - name: Publish mobile coverage for Sonar
        run: |
          mkdir -p reports/coverage/mobile
          cp mobile/coverage/lcov.info reports/coverage/mobile/lcov.info

      - name: Upload mobile coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-coverage
          path: reports/coverage/mobile/
          retention-days: 5
          if-no-files-found: error
