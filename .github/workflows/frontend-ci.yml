name: Frontend CI

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w @wealth-stack/shared

      - name: Lint
        run: npm run lint -w wealth-stack-web

      - name: TypeScript validation
        run: npm run typecheck -w wealth-stack-web

      - name: Production build
        run: npm run build -w wealth-stack-web

      - name: Tests and coverage thresholds
        run: npm run coverage:sonar -w wealth-stack-web

      - name: Upload frontend coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: reports/coverage/web/
          retention-days: 5
          if-no-files-found: error
