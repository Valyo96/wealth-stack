name: Sonar Analysis

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: sonar-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  backend-coverage:
    name: Collect backend coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Generate Go + Cobertura coverage reports
        run: bash scripts/generate-backend-coverage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: sonar-backend-coverage
          path: reports/coverage/backend/
          retention-days: 1

  frontend-coverage:
    name: Collect frontend coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Generate lcov + Cobertura coverage reports
        run: bash scripts/generate-frontend-coverage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: sonar-frontend-coverage
          path: reports/coverage/web/
          retention-days: 1

  android-coverage:
    name: Collect Android JaCoCo coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 23

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      - name: Generate JaCoCo XML report
        run: bash scripts/generate-android-coverage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: sonar-android-coverage
          path: reports/coverage/android/
          retention-days: 1
          if-no-files-found: error

  sonar:
    name: SonarCloud analysis
    runs-on: ubuntu-latest
    needs: [backend-coverage, frontend-coverage, android-coverage]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: sonar-backend-coverage
          path: reports/coverage/backend

      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: sonar-frontend-coverage
          path: reports/coverage/web

      - name: Download Android JaCoCo report
        uses: actions/download-artifact@v4
        with:
          name: sonar-android-coverage
          path: reports/coverage/android

      - name: Validate Sonar token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "${SONAR_TOKEN}" ]; then
            echo "SONAR_TOKEN secret is not configured. Add it in GitHub repository settings." >&2
            exit 1
          fi

      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@0303d6b62e310685c0e34d0b9cde218036885c4d # v5.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarCloud quality gate
        uses: SonarSource/sonarqube-quality-gate-action@d304d050d930b02a896b0f85935344f023928496 # v1.1.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
