name: Sonar Analysis

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: sonar-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  backend-coverage:
    name: Collect backend coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Generate backend coverage
        working-directory: backend
        run: |
          PACKAGES="$(go list ./... | grep -v /integration)"
          go test ${PACKAGES} -coverprofile=coverage.out -covermode=atomic -coverpkg=./...

      - uses: actions/upload-artifact@v4
        with:
          name: sonar-backend-coverage
          path: backend/coverage.out
          retention-days: 1

  frontend-coverage:
    name: Collect frontend coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run coverage

      - uses: actions/upload-artifact@v4
        with:
          name: sonar-frontend-coverage
          path: web/coverage/lcov.info
          retention-days: 1

  sonar:
    name: SonarCloud analysis
    runs-on: ubuntu-latest
    needs: [backend-coverage, frontend-coverage]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: sonar-backend-coverage
          path: backend

      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: sonar-frontend-coverage
          path: web/coverage

      - name: Validate Sonar token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "${SONAR_TOKEN}" ]; then
            echo "SONAR_TOKEN secret is not configured. Add it in GitHub repository settings." >&2
            exit 1
          fi

      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarCloud quality gate
        uses: SonarSource/sonarqube-quality-gate-action@v1.1.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
