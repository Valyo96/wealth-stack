name: Backend CI

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Download Go modules
        working-directory: backend
        run: go mod download

      - name: Static analysis (go vet)
        working-directory: backend
        run: go vet ./...

      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@55c2c1448f86e01eaae002a5a3a9624417608d84 # v6
        with:
          version: v1.62.2
          working-directory: backend

      - name: Unit tests with coverage
        run: bash scripts/generate-backend-coverage.sh

      - name: Enforce coverage threshold
        run: bash scripts/check-backend-coverage.sh reports/coverage/backend/coverage.out

      - name: Integration tests
        working-directory: backend
        run: go test -tags=integration ./internal/integration/... -v -timeout 5m

      - name: Race detector
        working-directory: backend
        run: |
          PACKAGES="$(go list ./... | grep -v /integration)"
          go test -race ${PACKAGES} -timeout 5m

      - name: Upload backend coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: reports/coverage/backend/
          retention-days: 5
          if-no-files-found: error
