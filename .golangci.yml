run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - misspell
    - unconvert

linters-settings: {}

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
    - path: internal/store/.*\.sql\.go
      linters:
        - gofmt
