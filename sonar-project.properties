sonar.projectKey=Valyo96_wealth-stack
sonar.organization=valyo96

sonar.projectName=wealth-stack
sonar.projectVersion=0.1.0

# SonarCloud does NOT calculate coverage — it imports reports generated by your test runners.
#
# JaCoCo only instruments JVM bytecode (Android/Kotlin). Go and TypeScript cannot use JaCoCo.
# Each stack uses the Sonar-documented importer for its language:
#
#   Stack     | Generator              | Sonar property                      | Report path
#   ----------|------------------------|-------------------------------------|----------------------------------
#   Backend   | go test -coverprofile  | sonar.go.coverage.reportPaths       | reports/coverage/backend/coverage.out
#   Frontend  | Vitest (V8/lcov)       | sonar.javascript.lcov.reportPaths   | reports/coverage/web/lcov.info
#   Android   | JaCoCo                 | sonar.coverage.jacoco.xmlReportPaths| reports/coverage/android/jacocoTestReport.xml
#
# Cobertura XML is generated for the web stack as a local/CI artifact.
# SonarCloud imports the language-specific paths above, not Cobertura, for Go/JS.

sonar.sources=backend,web/src,android/app/src/main
sonar.tests=backend,web/src,android/app/src/test
sonar.test.inclusions=**/*_test.go,**/*.test.ts,**/*.test.tsx,**/*Test.kt

sonar.sourceEncoding=UTF-8

# --- Analysis exclusions (config, DTOs, wiring, generated code, bootstrap) ---
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/reports/**,\
  backend/cmd/**,\
  backend/internal/config/**,\
  backend/internal/store/**,\
  backend/internal/apiresp/**,\
  backend/internal/http/router.go,\
  backend/internal/http/middleware/cors.go,\
  web/src/api/types.ts,\
  web/src/vite-env.d.ts,\
  web/src/main.tsx,\
  web/src/test/**,\
  android/**/Models.kt,\
  android/**/di/**,\
  android/**/MainActivity.kt,\
  android/**/WealthStackApplication.kt,\
  android/**/theme/**,\
  android/**/navigation/Routes.kt,\
  android/**/navigation/NavGraph.kt,\
  android/**/NetworkModule.kt

# --- Coverage exclusions (no coverage gate on boilerplate) ---
sonar.coverage.exclusions=\
  backend/cmd/**,\
  backend/internal/config/**,\
  backend/internal/store/**,\
  backend/internal/apiresp/**,\
  backend/internal/http/router.go,\
  backend/internal/http/middleware/cors.go,\
  web/src/api/types.ts,\
  web/src/vite-env.d.ts,\
  web/src/main.tsx,\
  android/**/Models.kt,\
  android/**/di/**,\
  android/**/MainActivity.kt,\
  android/**/WealthStackApplication.kt,\
  android/**/theme/**,\
  android/**/navigation/**,\
  android/**/NetworkModule.kt,\
  android/**/*Screen.kt,\
  android/**/*Screen*.kt

# --- Sonar coverage imports (one report per language family) ---
sonar.go.coverage.reportPaths=reports/coverage/backend/coverage.out
sonar.javascript.lcov.reportPaths=reports/coverage/web/lcov.info
sonar.coverage.jacoco.xmlReportPaths=reports/coverage/android/jacocoTestReport.xml
