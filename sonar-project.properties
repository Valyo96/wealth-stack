sonar.projectKey=Valyo96_wealth-stack
sonar.organization=valyo96

sonar.projectName=wealth-stack
sonar.projectVersion=0.1.0

# SonarCloud imports coverage reports generated by CI (Go coverprofile, Vitest/Jest lcov).
#
#   Stack     | Generator              | Sonar property                      | Report path
#   ----------|------------------------|-------------------------------------|----------------------------------
#   Backend   | go test -coverprofile  | sonar.go.coverage.reportPaths       | reports/coverage/backend/coverage.out
#   Web       | Vitest (V8/lcov)       | sonar.javascript.lcov.reportPaths   | reports/coverage/web/lcov.info
#   Mobile    | Jest (lcov)            | sonar.javascript.lcov.reportPaths   | reports/coverage/mobile/lcov.info

sonar.sources=backend,web/src,mobile/app,mobile/src,packages/shared/src
sonar.tests=backend,web/src,mobile/app,mobile/src,packages/shared/src
sonar.test.inclusions=**/*_test.go,**/*.test.ts,**/*.test.tsx

sonar.sourceEncoding=UTF-8

sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/reports/**,\
  backend/cmd/**,\
  backend/internal/config/**,\
  backend/internal/store/**,\
  backend/internal/apiresp/**,\
  backend/internal/http/router.go,\
  backend/internal/http/middleware/cors.go,\
  web/src/api/types.ts,\
  web/src/vite-env.d.ts,\
  web/src/main.tsx,\
  web/src/test/**,\
  mobile/app.json,\
  packages/shared/src/types.ts

sonar.coverage.exclusions=\
  backend/cmd/**,\
  backend/internal/config/**,\
  backend/internal/store/**,\
  backend/internal/apiresp/**,\
  backend/internal/http/router.go,\
  backend/internal/http/middleware/cors.go,\
  web/src/api/types.ts,\
  web/src/vite-env.d.ts,\
  web/src/main.tsx,\
  packages/shared/src/types.ts

sonar.go.coverage.reportPaths=reports/coverage/backend/coverage.out
sonar.javascript.lcov.reportPaths=reports/coverage/web/lcov.info,reports/coverage/mobile/lcov.info
